<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PWA Сканер Чеков</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#2196F3">
    <!-- Подключение Tesseract.js из CDN для OCR -->
    <script src="https://jsdelivr.net"></script>
    <script src="https://jsdelivr.net"></script>
    <style>
        body { font-family: sans-serif; margin: 0; padding: 15px; background: #f5f5f5; color: #333; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        h1, h2 { text-align: center; color: #1976D2; }
        button { background: #2196F3; color: white; border: none; padding: 10px 15px; border-radius: 4px; cursor: pointer; font-size: 16px; width: 100%; margin: 5px 0; }
        button:disabled { background: #bbb; }
        video, canvas { width: 100%; max-height: 400px; border-radius: 4px; background: #000; margin-top: 10px; display: none; }
        .receipt-card { border: 1px solid #ddd; padding: 10px; margin: 10px 0; border-radius: 4px; background: #fafafa; }
        .receipt-card tech { font-size: 12px; color: #666; display: block; margin-top: 5px; }
        .status { font-weight: bold; color: #e65100; text-align: center; margin: 10px 0; }
        pre { background: #eee; padding: 10px; overflow-x: auto; white-space: pre-wrap; font-size: 13px; max-height: 150px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Сканер Чеков PWA</h1>
        <div id="status" class="status"></div>

        
        <button id="btn-start">Включить камеру</button>
        <video id="video" autoplay playsinline></video>
        <button id="btn-snap" style="display:none; background:#4CAF50;">Сделать фото и распознать</button>
        <canvas id="canvas"></canvas>

       
        <h2>Сохраненные чеки</h2>
        <div id="history"></div>
    </div>
    <script src="app.js"></script>
</body>
</html>
